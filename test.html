<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Logic Tests</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .test-panel {
        width: min(100%, 720px);
      }

      .results {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
      }

      .results li {
        padding: 12px 14px;
        border-radius: 14px;
        margin-top: 10px;
        background: #f3ebdb;
        border: 1px solid #d7c9ac;
      }

      .results li.fail {
        border-color: #c34739;
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="panel test-panel">
        <p class="eyebrow">No-dependency checks</p>
        <h1>Snake Logic Tests</h1>
        <p class="status" id="summary">Running tests...</p>
        <ul class="results" id="results"></ul>
      </section>
    </main>

    <script type="module">
      import {
        createInitialState,
        positionsEqual,
        queueDirection,
        spawnFood,
        startGame,
        stepGame,
      } from "./src/snake-logic.js";

      const resultsElement = document.querySelector("#results");
      const summaryElement = document.querySelector("#summary");
      const results = [];

      runTest("Initial food never spawns on the snake", () => {
        const state = createInitialState({ rng: () => 0 });
        return !state.snake.some((segment) => positionsEqual(segment, state.food));
      });

      runTest("Movement advances the head in the active direction", () => {
        const started = startGame(createInitialState({ rng: () => 0 }));
        const next = stepGame(started, () => 0);
        return next.snake[0].x === started.snake[0].x + 1 && next.snake[0].y === started.snake[0].y;
      });

      runTest("Reverse turns are ignored", () => {
        const state = createInitialState({ rng: () => 0 });
        const next = queueDirection(state, "left");
        return next.queuedDirection === state.queuedDirection;
      });

      runTest("Eating food increases score, grows the snake, and respawns food", () => {
        const state = {
          gridSize: 5,
          snake: [
            { x: 2, y: 2 },
            { x: 1, y: 2 },
            { x: 0, y: 2 },
          ],
          direction: "right",
          queuedDirection: "right",
          food: { x: 3, y: 2 },
          score: 0,
          status: "running",
        };
        const next = stepGame(state, () => 0);
        return (
          next.score === 1 &&
          next.snake.length === 4 &&
          !next.snake.some((segment) => positionsEqual(segment, next.food))
        );
      });

      runTest("Wall collisions end the game", () => {
        const state = {
          gridSize: 4,
          snake: [{ x: 3, y: 1 }],
          direction: "right",
          queuedDirection: "right",
          food: { x: 0, y: 0 },
          score: 0,
          status: "running",
        };
        return stepGame(state, () => 0).status === "gameover";
      });

      runTest("Self collisions end the game", () => {
        const state = {
          gridSize: 5,
          snake: [
            { x: 2, y: 2 },
            { x: 2, y: 3 },
            { x: 1, y: 3 },
            { x: 1, y: 2 },
            { x: 1, y: 1 },
            { x: 2, y: 1 },
          ],
          direction: "down",
          queuedDirection: "left",
          food: { x: 4, y: 4 },
          score: 0,
          status: "running",
        };
        return stepGame(state, () => 0).status === "gameover";
      });

      runTest("Food placement only uses open cells", () => {
        const state = {
          gridSize: 2,
          snake: [
            { x: 0, y: 0 },
            { x: 1, y: 0 },
            { x: 0, y: 1 },
          ],
        };
        const food = spawnFood(state, () => 0.9);
        return food.x === 1 && food.y === 1;
      });

      const passed = results.filter((result) => result.pass).length;
      summaryElement.textContent = `${passed}/${results.length} tests passed.`;

      for (const result of results) {
        const item = document.createElement("li");
        item.className = result.pass ? "pass" : "fail";
        item.textContent = `${result.pass ? "PASS" : "FAIL"}: ${result.name}`;
        resultsElement.append(item);
      }

      function runTest(name, fn) {
        let pass = false;

        try {
          pass = Boolean(fn());
        } catch (error) {
          pass = false;
          console.error(name, error);
        }

        results.push({ name, pass });
      }
    </script>
  </body>
</html>
